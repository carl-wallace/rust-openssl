[package]
name = "openssl-errors_10_55"
version = "0.2.0"
authors = ["Steven Fackler <sfackler@gmail.com>"]
edition = "2018"
license = "MIT/Apache-2.0"
description = "Custom error library support for the openssl crate."
repository = "https://github.com/sfackler/rust-openssl"
readme = "README.md"
categories = ["api-bindings"]

[dependencies]
cfg-if = "1.0"
libc = "0.2"

openssl-sys_10_55 = { version = "0.9.89", path = "../openssl-sys" }

[dev-dependencies]
openssl_10_55 = { version = "0.10.55", path = "../openssl" }
